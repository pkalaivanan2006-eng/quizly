{% extends "base.html" %}{% block title %}{{ 'Edit quiz' if quiz else 'Create quiz' }}{% endblock %}{% block content %}<div class="narrow"><a href="{{ url_for('admin_dashboard') }}" class="back-link">← Back to admin</a><form class="form-card form-wide" method="post"><span class="eyebrow">QUIZ MANAGEMENT</span><h2>{{ 'Edit quiz' if quiz else 'Create a new quiz' }}</h2><label>Quiz title<input name="title" required maxlength="120" value="{{ quiz.title if quiz else '' }}" placeholder="e.g. Web Technology Basics"></label><label>Description<textarea name="description" rows="4" placeholder="Briefly describe this quiz">{{ quiz.description if quiz else '' }}</textarea></label><button class="btn" type="submit">Save quiz →</button></form></div>{% endblock %}
