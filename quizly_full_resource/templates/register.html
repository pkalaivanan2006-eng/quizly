{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}<div class="auth-wrap auth-single"><form class="form-card" method="post"><span class="eyebrow">GET STARTED</span><h2>Create participant account</h2><p class="muted">Join to take quizzes and track your progress.</p><label>Full name<input name="name" required maxlength="80" autocomplete="name" placeholder="Your name"></label><label>Email address<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><button class="btn btn-block" type="submit">Create account →</button><div class="form-foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></div><div class="demo-hint">Registration creates a participant account. Admin accounts are managed separately.</div></form></div>{% endblock %}
